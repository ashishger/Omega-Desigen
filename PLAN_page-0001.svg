  <text x="980" y="700" font-family="Inter, Arial" font-size="58" font-weight="700" fill="#111">FIRST FLOOR PLAN</text>
  <text x="980" y="955" font-family="Inter, Arial" font-size="58" font-weight="700" fill="#111">ROOF BEAM PLAN</text>
  <text x="70" y="950" font-family="Inter, Arial" font-size="54" font-weight="800" fill="#111">AIM CONSTRUCTION GROUP</text>
